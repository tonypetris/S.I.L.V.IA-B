<style>
:root{--bg:#ffffff;--card:#fff;--ink:#282828;--mut:#646464;--brand:#0078c3;--acc:#0078c3;--dk:#002841;--cta:#cc4400;--ln:#dde2e7;--ok:#12803f;--wn:#b36b00;--bd:#c62828;--grid:#e9edf1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 400px at 85% -100px,#0078c31f,transparent),var(--bg);color:var(--ink);font:14px/1.5 "Nunito Sans","Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:linear-gradient(100deg,var(--dk),#004673);color:#fff;border-bottom:4px solid var(--acc);box-shadow:0 4px 16px #0a2a3a33}
header h1 .sub b{font-weight:900;font-size:1.3em}.acrv{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);margin:4px 0 18px}.acrv .ac{display:flex;flex-direction:column;align-items:center;width:clamp(38px,9vw,64px)}.acrv b{font-size:clamp(40px,9vw,62px);line-height:1;font-weight:900;color:var(--acc)}.acrv span{writing-mode:vertical-rl;font-size:clamp(14px,2.6vw,19px);font-weight:600;color:var(--ink);letter-spacing:.02em;margin-top:2px;padding-top:6px;border-top:3px solid var(--acc);height:7.6em}header h1 .sub{display:block;color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.06em;opacity:.85;margin-top:2px}@media(max-width:700px){header h1 .sub{display:none}}header h1{font-size:17px;margin:0 auto 0 4px;font-weight:600;padding-left:14px;border-left:1px solid #ffffff44}
.wm{font-weight:800;font-size:30px;letter-spacing:-1.2px;color:#fff;line-height:1}.wm.sm{font-size:22px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px;transition:background .15s,border-color .15s,transform .1s}button:active{transform:translateY(1px)}
button:hover{border-color:var(--brand)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header button,header .btn{background:#ffffff14;color:#fff;border-color:#ffffff4d;border-radius:999px;font-weight:600}header button:hover,header .btn:hover{background:#ffffff2b}
.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}.pri:hover{filter:brightness(.88)}header .acc{background:var(--cta);border-color:var(--cta);color:#fff}header .acc:hover{filter:brightness(1.1)}
.pk{display:flex;align-items:center;gap:4px;color:#fff;font-size:12px}input[type=color]{width:28px;height:28px;border:2px solid #fff8;border-radius:50%;padding:0;background:none;cursor:pointer}
main{padding:14px;max-width:1700px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;min-width:0;box-shadow:0 6px 20px #0b27331a}
.card h2{margin:0 0 12px;font-size:15px;font-weight:800;color:var(--ink);padding-left:10px;border-left:4px solid var(--acc)}
.wiz{max-width:780px;margin:36px auto;padding:28px;border-top:5px solid var(--acc)}.wiz h2{font-size:24px;border:0;padding:0}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps span.on{background:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.opt{padding:22px 28px;border-radius:12px;border:2px solid var(--ln);background:var(--card);font-size:18px;font-weight:800;min-width:160px}
.opt:hover:not(:disabled){border-color:var(--acc);box-shadow:0 6px 16px #0078c333}.opt.on{border-color:var(--acc);background:#0078c318;box-shadow:0 6px 16px #0078c333}.opt:disabled{opacity:.4;cursor:not-allowed}
.chip{padding:6px 12px;border-radius:20px}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(270px,1fr);gap:12px;align-items:start}.sldc{grid-column:1/-1}#sld{overflow:auto;padding-bottom:6px;max-height:80vh}.zm{margin-left:auto;display:inline-flex;gap:6px}.tg{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px 12px;color:var(--mut);font-size:12.5px}
.mid{display:grid;gap:12px;min-width:0}
@media(max-width:1050px){.grid{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.sdl text{fill:var(--ink);font-size:11px}
.fp{position:relative;background:repeating-linear-gradient(45deg,#161c21 0 2px,#1e262c 2px 4px);border-radius:12px;padding:18px 14px 14px;color:#d7e3e8;border:2px solid #3b4a52;border-top:4px solid var(--acc);box-shadow:inset 0 1px 0 #ffffff26,inset 0 0 30px #0008,0 8px 18px #0006}
.fp::before,.fp::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:radial-gradient(#8a97a0,#3a444b)}.fp::before{left:8px}.fp::after{right:8px}
.fp .brand{display:flex;justify-content:space-between;font-weight:700;letter-spacing:1px;color:#fff}
.fp .brand i{font-style:normal;color:var(--acc)}
.lcd{background:linear-gradient(#c9f0fa,#a6dcec);color:#06303d;font:700 20px/1.2 "Courier New",monospace;padding:8px 10px;border-radius:4px;margin:8px 0;box-shadow:inset 0 0 12px #0006;text-shadow:0 0 3px #fff6}
.lcd small{display:block;font-size:11px;opacity:.75}
.leds{display:flex;gap:12px;margin:6px 0 8px;font-size:11px}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#444;margin-right:4px;vertical-align:-1px}
.led.on.g{background:#2fe27a;box-shadow:0 0 8px #2fe27a}.led.on.a{background:#ffb020;box-shadow:0 0 8px #ffb020}.led.on.r{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.prm{display:grid;grid-template-columns:1fr auto 70px auto;gap:5px;align-items:center;margin:5px 0}
